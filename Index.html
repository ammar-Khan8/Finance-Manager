<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Finance Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Personal Budget</p>
          <h1>Finance Manager</h1>
        </div>
        <button id="logoutBtn" class="secondary hidden">Log out</button>
      </header>

      <main>
        <section id="authPanel" class="panel">
          <h2>Welcome</h2>
          <form id="authForm" class="stack">
            <label>
              Username
              <input id="username" type="text" required minlength="3" />
            </label>
            <label>
              Password
              <input id="password" type="password" required minlength="4" />
            </label>
            <div class="button-row">
              <button type="submit" class="primary">Login</button>
              <button type="button" id="registerBtn" class="secondary">Register</button>
            </div>
          </form>
        </section>

        <section id="appPanel" class="hidden">
          <div class="summary-grid">
            <article class="summary-card income">
              <span>Income</span>
              <strong id="incomeSummary">$0.00</strong>
            </article>
            <article class="summary-card expense">
              <span>Expenses</span>
              <strong id="expenseSummary">$0.00</strong>
            </article>
            <article class="summary-card net">
              <span>Net</span>
              <strong id="netSummary">$0.00</strong>
            </article>
          </div>

          <div class="layout-grid">
            <section class="panel">
              <h2>Add transaction</h2>
              <form id="transactionForm" class="stack">
                <label>
                  Type
                  <select id="transactionType">
                    <option value="income">Income</option>
                    <option value="expense">Expense</option>
                  </select>
                </label>
                <label>
                  Amount
                  <input id="amount" type="number" min="0.01" step="0.01" required />
                </label>
                <label>
                  Category
                  <select id="category"></select>
                </label>
                <label>
                  Date
                  <input id="transactionDate" type="date" required />
                </label>
                <label>
                  Description
                  <input id="description" type="text" maxlength="80" placeholder="Optional" />
                </label>
                <button type="submit" class="primary">Save</button>
              </form>
            </section>

            <section class="panel">
              <h2>Monthly budget</h2>
              <form id="budgetForm" class="stack">
                <label>
                  Category
                  <select id="budgetCategory"></select>
                </label>
                <label>
                  Month
                  <input id="budgetMonth" type="month" required />
                </label>
                <label>
                  Limit
                  <input id="budgetLimit" type="number" min="0.01" step="0.01" required />
                </label>
                <button type="submit" class="primary">Set budget</button>
              </form>
            </section>
          </div>

          <section class="panel">
            <div class="toolbar">
              <h2>Transactions</h2>
              <label>
                Filter month
                <input id="filterMonth" type="month" />
              </label>
            </div>
            <div id="transactionList" class="transaction-list"></div>
          </section>

          <section class="panel">
            <h2>Budget status</h2>
            <div id="budgetStatus" class="budget-status"></div>
          </section>

          <section class="panel">
            <h2>Monthly report</h2>
            <div id="reportSummary" class="report-summary"></div>
            <div id="categoryBreakdown" class="category-breakdown"></div>
          </section>
        </section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
